name: Sync upstream

on:
  schedule:
    - cron: '23 * * * *' # 毎時23分に本家と同期
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main with BaaRai/ARTEX
        env:
          # Contents と Workflows の Read/Write 権限を持つ Fine-grained PAT
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh repo sync "$GITHUB_REPOSITORY" --source BaaRai/ARTEX --branch main
